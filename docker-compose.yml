services:
  otolith:
    build: .
    ports:
      - "7860:7860"
    volumes:
      # Mapeie suas pastas locais aqui — os dados nunca ficam dentro da imagem
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
